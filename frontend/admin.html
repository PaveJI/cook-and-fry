<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Заказы обедов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 p-4" x-data="adminApp()">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">Заказы обедов</h1>

    <template x-if="!token">
      <div class="bg-white p-6 rounded shadow max-w-sm mx-auto mt-10">
        <h2 class="text-lg font-semibold mb-4">Вход</h2>
        <input x-model="inputToken" type="password" placeholder="Admin token" class="w-full border p-2 rounded mb-4">
        <button @click="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Войти</button>
        <p x-show="error" x-text="error" class="text-red-600 text-sm mt-2"></p>
      </div>
    </template>

    <template x-if="token">
      <div>
        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-4">
          <div class="bg-white p-3 rounded shadow text-center">
            <div class="text-xs text-gray-500">Всего</div>
            <div class="text-xl font-bold" x-text="stats.total"></div>
          </div>
          <div class="bg-white p-3 rounded shadow text-center">
            <div class="text-xs text-gray-500">Новые</div>
            <div class="text-xl font-bold text-blue-600" x-text="stats.new"></div>
          </div>
          <div class="bg-white p-3 rounded shadow text-center">
            <div class="text-xs text-gray-500">Подтверждены</div>
            <div class="text-xl font-bold text-indigo-600" x-text="stats.confirmed"></div>
          </div>
          <div class="bg-white p-3 rounded shadow text-center">
            <div class="text-xs text-gray-500">Готовятся</div>
            <div class="text-xl font-bold text-yellow-600" x-text="stats.preparing"></div>
          </div>
          <div class="bg-white p-3 rounded shadow text-center">
            <div class="text-xs text-gray-500">Доставлены</div>
            <div class="text-xl font-bold text-green-600" x-text="stats.delivered"></div>
          </div>
        </div>

        <!-- Filters -->
        <div class="bg-white p-4 rounded shadow mb-4 flex flex-wrap gap-2 items-end">
          <button @click="load()" class="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300">Обновить</button>

          <div>
            <label class="block text-xs text-gray-500 mb-1">Статус</label>
            <select x-model="filter.status" @change="load()" class="border rounded p-2">
              <option value="">Все</option>
              <option value="new">Новые</option>
              <option value="confirmed">Подтверждены</option>
              <option value="preparing">Готовятся</option>
              <option value="delivered">Доставлены</option>
              <option value="cancelled">Отменены</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-gray-500 mb-1">Компания</label>
            <select x-model="filter.company" @change="load()" class="border rounded p-2">
              <option value="">Все</option>
              <template x-for="company in companies" :key="company">
                <option x-text="company" :value="company"></option>
              </template>
            </select>
          </div>

          <div>
            <label class="block text-xs text-gray-500 mb-1">Дата доставки</label>
            <input x-model="filter.date" @change="load()" type="date" class="border rounded p-2">
          </div>

          <div>
            <label class="block text-xs text-gray-500 mb-1">Поиск</label>
            <input x-model="filter.search" @keyup.enter="load()" type="text" class="border rounded p-2" placeholder="Имя, телефон, номер">
          </div>

          <button @click="logout()" class="ml-auto text-sm text-gray-500 hover:text-gray-700 py-2">Выйти</button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded shadow overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-200">
              <tr>
                <th class="p-3 text-left">№</th>
                <th class="p-3 text-left">Компания</th>
                <th class="p-3 text-left">Дата</th>
                <th class="p-3 text-left">Клиент</th>
                <th class="p-3 text-left">Телефон</th>
                <th class="p-3 text-left">Состав</th>
                <th class="p-3 text-left">Статус</th>
                <th class="p-3 text-left">Действия</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="order in orders" :key="order.id">
                <tr class="border-t hover:bg-gray-50">
                  <td class="p-3 font-mono" x-text="order.order_number"></td>
                  <td class="p-3" x-text="order.company_name"></td>
                  <td class="p-3 whitespace-nowrap" x-text="order.delivery_date"></td>
                  <td class="p-3" x-text="order.customer_name"></td>
                  <td class="p-3" x-text="order.customer_phone"></td>
                  <td class="p-3 max-w-xs">
                    <div class="text-xs text-gray-700">
                      <span x-text="order.dish1"></span>,
                      <span x-text="order.dish2"></span>,
                      <span x-text="order.dish3"></span>
                    </div>
                    <div class="text-xs text-gray-500 mt-1">
                      Напиток: <span x-text="order.drink || '—'"></span>,
                      Хлеб: <span x-text="order.bread || '—'"></span>
                    </div>
                    <div x-show="order.comment" class="text-xs text-gray-500 mt-1 italic" x-text="order.comment"></div>
                  </td>
                  <td class="p-3">
                    <span class="px-2 py-1 rounded text-xs"
                      :class="{
                        'bg-blue-100 text-blue-800': order.status === 'new',
                        'bg-indigo-100 text-indigo-800': order.status === 'confirmed',
                        'bg-yellow-100 text-yellow-800': order.status === 'preparing',
                        'bg-green-100 text-green-800': order.status === 'delivered',
                        'bg-gray-100 text-gray-800': order.status === 'cancelled'
                      }"
                      x-text="statusLabel(order.status)">
                    </span>
                  </td>
                  <td class="p-3">
                    <select @change="updateStatus(order.id, $event.target.value)" class="border rounded p-1 text-xs">
                      <option value="" disabled selected>Изменить</option>
                      <option value="new">Новый</option>
                      <option value="confirmed">Подтверждён</option>
                      <option value="preparing">Готовится</option>
                      <option value="delivered">Доставлен</option>
                      <option value="cancelled">Отменён</option>
                    </select>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>
  </div>

  <script>
    function adminApp() {
      return {
        token: localStorage.getItem("adminToken") || "",
        inputToken: "",
        error: "",
        orders: [],
        companies: [],
        stats: { total: 0, new: 0, confirmed: 0, preparing: 0, delivered: 0 },
        filter: {
          status: "",
          company: "",
          date: "",
          search: ""
        },

        init() {
          if (this.token) {
            this.loadCompanies();
            this.load();
          }
        },

        async login() {
          this.token = this.inputToken;
          localStorage.setItem("adminToken", this.token);
          await this.loadCompanies();
          await this.load();
        },

        logout() {
          this.token = "";
          this.orders = [];
          localStorage.removeItem("adminToken");
        },

        buildQuery() {
          const params = new URLSearchParams();
          if (this.filter.status) params.append("status", this.filter.status);
          if (this.filter.company) params.append("company", this.filter.company);
          if (this.filter.date) params.append("date", this.filter.date);
          if (this.filter.search) params.append("search", this.filter.search);
          return params.toString();
        },

        async load() {
          const headers = { "X-Admin-Token": this.token };
          try {
            const [ordersRes, statsRes] = await Promise.all([
              fetch(`/api/admin/orders?${this.buildQuery()}`, { headers }),
              fetch("/api/admin/stats", { headers })
            ]);

            if (!ordersRes.ok) throw new Error("Unauthorized");

            this.orders = (await ordersRes.json()).orders;
            this.stats = await statsRes.json();
            this.error = "";
          } catch (err) {
            this.token = "";
            this.error = "Неверный токен";
            localStorage.removeItem("adminToken");
          }
        },

        async loadCompanies() {
          const headers = { "X-Admin-Token": this.token };
          try {
            const res = await fetch("/api/admin/companies", { headers });
            if (res.ok) {
              this.companies = (await res.json()).companies;
            }
          } catch (err) {
            console.error(err);
          }
        },

        async updateStatus(id, status) {
          const headers = {
            "X-Admin-Token": this.token,
            "Content-Type": "application/json"
          };
          const res = await fetch(`/api/admin/orders/${id}/status`, {
            method: "PATCH",
            headers,
            body: JSON.stringify({ status })
          });
          if (res.ok) await this.load();
        },

        statusLabel(status) {
          const labels = {
            new: "Новый",
            confirmed: "Подтверждён",
            preparing: "Готовится",
            delivered: "Доставлен",
            cancelled: "Отменён"
          };
          return labels[status] || status;
        }
      };
    }
  </script>
</body>
</html>
