<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Cook and Fry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root {
      --bg-base: #f0f4ff;
      --text-primary: #0a0f1e;
      --text-secondary: #1e293b;
      --text-muted: #475569;
      --glass-bg: rgba(255,255,255,0.78);
      --glass-border: rgba(255,255,255,0.6);
      --input-bg: rgba(0,0,0,0.03);
      --input-border: rgba(0,0,0,0.08);
      --primary: #2563EB;
      --primary-2: #7C3AED;
      --accent: #E11D48;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-base: #020205;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --glass-bg: rgba(15,23,42,0.65);
        --glass-border: rgba(255,255,255,0.12);
        --input-bg: rgba(255,255,255,0.05);
        --input-border: rgba(255,255,255,0.10);
        --primary: #3B82F6;
        --primary-2: #8B5CF6;
      }
    }
    body { background: var(--bg-base); color: var(--text-primary); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .admin-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid var(--glass-border);
      border-radius: 1.25rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.06);
    }
    .admin-input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.625rem;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.875rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .admin-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    select.admin-input option { background: #ffffff; color: var(--text-primary); }
    @media (prefers-color-scheme: dark) { select.admin-input option { background: #1e293b; color: var(--text-primary); } }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.55rem 1rem; border-radius: 0.625rem; border: none;
      font-weight: 600; font-size: 0.875rem; cursor: pointer; color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.25); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.45rem 0.75rem; border-radius: 0.625rem;
      font-weight: 600; font-size: 0.75rem; cursor: pointer;
      background: var(--input-bg); color: var(--text-primary);
      border: 1px solid var(--input-border);
    }
    .btn-danger { background: rgba(225,29,72,0.1); color: var(--accent); border-color: rgba(225,29,72,0.2); }
  </style>
</head>
<body class="p-4" x-data="adminApp()">
  <div class="max-w-7xl mx-auto">
    <header class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold" style="color:var(--text-primary)">Админ-панель</h1>
        <p class="text-sm" style="color:var(--text-muted)">Cook and Fry — управление заказчиками и заявками</p>
      </div>
      <template x-if="token">
        <button @click="logout()" class="btn-secondary">Выйти</button>
      </template>
    </header>

    <template x-if="!token">
      <div class="admin-card p-6 max-w-sm mx-auto mt-10">
        <h2 class="text-lg font-semibold mb-4" style="color:var(--text-primary)">Вход</h2>
        <input x-model="inputUsername" type="text" placeholder="Логин" class="admin-input mb-3">
        <input x-model="inputPassword" type="password" placeholder="Пароль" class="admin-input mb-4">
        <button @click="login()" class="btn-primary w-full">Войти</button>
        <p x-show="error" x-text="error" class="text-red-600 text-sm mt-2"></p>
      </div>
    </template>

    <template x-if="token">
      <div class="space-y-6">
        <!-- Customers -->
        <section class="admin-card p-5">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold" style="color:var(--text-primary)">Заказчики</h2>
            <button @click="loadCustomers()" class="btn-secondary">Обновить</button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr style="border-bottom:1px solid var(--input-border)">
                  <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Компания</th>
                  <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Адрес</th>
                  <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Телефон КЛ</th>
                  <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Действия</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="customer in customers" :key="customer.id">
                  <tr style="border-bottom:1px solid var(--input-border)">
                    <td x-show="editingId !== customer.id" class="p-3" x-text="customer.company_name"></td>
                    <td x-show="editingId !== customer.id" class="p-3" x-text="customer.address || '—'"></td>
                    <td x-show="editingId !== customer.id" class="p-3" x-text="customer.customer_phone || '—'"></td>
                    <td x-show="editingId !== customer.id" class="p-3">
                      <div class="flex gap-2">
                        <button @click="startEdit(customer)" class="btn-secondary">Изменить</button>
                        <button @click="deleteCustomer(customer.id)" class="btn-secondary btn-danger">Удалить</button>
                      </div>
                    </td>
                    <td x-show="editingId === customer.id" colspan="4" class="p-3">
                      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                        <input x-model="editCustomer.company_name" type="text" placeholder="Компания" class="admin-input">
                        <input x-model="editCustomer.address" type="text" placeholder="Адрес" class="admin-input">
                        <input x-model="editCustomer.customer_phone" type="text" placeholder="Телефон КЛ" class="admin-input">
                        <div class="flex gap-2">
                          <button @click="saveEdit(customer.id)" class="btn-primary flex-1">Сохранить</button>
                          <button @click="cancelEdit()" class="btn-secondary">Отмена</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
              <tfoot>
                <tr>
                  <td colspan="4" class="p-3">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                      <input x-model="newCustomer.company_name" type="text" placeholder="Компания" class="admin-input">
                      <input x-model="newCustomer.address" type="text" placeholder="Адрес" class="admin-input">
                      <input x-model="newCustomer.customer_phone" type="text" placeholder="Телефон КЛ" class="admin-input">
                      <button @click="addCustomer()" class="btn-primary w-full">Добавить</button>
                    </div>
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </section>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
          <div class="admin-card p-3 text-center">
            <div class="text-xs" style="color:var(--text-muted)">Всего</div>
            <div class="text-xl font-bold" x-text="stats.total"></div>
          </div>
          <div class="admin-card p-3 text-center">
            <div class="text-xs" style="color:var(--text-muted)">Новые</div>
            <div class="text-xl font-bold" style="color:var(--primary)" x-text="stats.new"></div>
          </div>
          <div class="admin-card p-3 text-center">
            <div class="text-xs" style="color:var(--text-muted)">Подтверждены</div>
            <div class="text-xl font-bold" style="color:var(--primary-2)" x-text="stats.confirmed"></div>
          </div>
          <div class="admin-card p-3 text-center">
            <div class="text-xs" style="color:var(--text-muted)">Готовятся</div>
            <div class="text-xl font-bold" style="color:#B45309" x-text="stats.preparing"></div>
          </div>
          <div class="admin-card p-3 text-center">
            <div class="text-xs" style="color:var(--text-muted)">Доставлены</div>
            <div class="text-xl font-bold" style="color:#059669" x-text="stats.delivered"></div>
          </div>
        </div>

        <!-- Filters -->
        <div class="admin-card p-4 flex flex-wrap gap-3 items-end">
          <button @click="load()" class="btn-secondary">Обновить</button>

          <div>
            <label class="block text-xs mb-1" style="color:var(--text-muted)">Статус</label>
            <select x-model="filter.status" @change="page=1; load()" class="admin-input">
              <option value="">Все</option>
              <option value="new">Новые</option>
              <option value="confirmed">Подтверждены</option>
              <option value="preparing">Готовятся</option>
              <option value="delivered">Доставлены</option>
              <option value="cancelled">Отменены</option>
            </select>
          </div>

          <div>
            <label class="block text-xs mb-1" style="color:var(--text-muted)">Компания</label>
            <select x-model="filter.company" @change="page=1; load()" class="admin-input">
              <option value="">Все</option>
              <template x-for="company in companies" :key="company">
                <option x-text="company" :value="company"></option>
              </template>
            </select>
          </div>

          <div>
            <label class="block text-xs mb-1" style="color:var(--text-muted)">Дата от</label>
            <input x-model="filter.dateFrom" @change="page=1; load()" type="date" class="admin-input">
          </div>

          <div>
            <label class="block text-xs mb-1" style="color:var(--text-muted)">Дата (точно)</label>
            <input x-model="filter.date" @change="page=1; load()" type="date" class="admin-input">
          </div>

          <div>
            <label class="block text-xs mb-1" style="color:var(--text-muted)">Поиск</label>
            <input x-model="filter.search" @keyup.enter="page=1; load()" type="text" class="admin-input" placeholder="Имя, телефон, номер">
          </div>

          <button @click="resetFilters()" class="btn-secondary">Сбросить фильтры</button>

          <button @click="sortDesc = !sortDesc; page = 1; load()"
                  class="btn-secondary"
                  x-text="sortDesc ? 'От нового к старому ↓' : 'От старого к новому ↑'">
          </button>
        </div>

        <!-- Orders table -->
        <div class="admin-card overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr style="border-bottom:1px solid var(--input-border)">
                <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">№</th>
                <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Компания</th>
                <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Дата</th>
                <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Клиент</th>
                <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Телефон</th>
                <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Состав</th>
                <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Статус</th>
                <th class="p-3 text-left font-semibold" style="color:var(--text-secondary)">Действия</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="order in orders" :key="order.id">
                <tr style="border-bottom:1px solid var(--input-border)">
                  <td class="p-3 font-mono" x-text="order.order_number"></td>
                  <td class="p-3" x-text="order.company_name"></td>
                  <td class="p-3 whitespace-nowrap" x-text="order.delivery_date"></td>
                  <td class="p-3" x-text="order.customer_name"></td>
                  <td class="p-3" x-text="order.customer_phone"></td>
                  <td class="p-3 max-w-xs">
                    <div style="color:var(--text-secondary)">
                      <span x-text="order.dish1"></span>,
                      <span x-text="order.dish2"></span>,
                      <span x-text="order.dish3"></span>
                    </div>
                    <div class="text-xs mt-1" style="color:var(--text-muted)">
                      Напиток: <span x-text="order.drink || '—'"></span>,
                      Хлеб: <span x-text="order.bread || '—'"></span>
                    </div>
                    <div x-show="order.comment" class="text-xs mt-1 italic" style="color:var(--text-muted)" x-text="order.comment"></div>
                  </td>
                  <td class="p-3">
                    <span class="px-2 py-1 rounded text-xs font-medium"
                      :class="{
                        'bg-blue-100 text-blue-800': order.status === 'new',
                        'bg-indigo-100 text-indigo-800': order.status === 'confirmed',
                        'bg-yellow-100 text-yellow-800': order.status === 'preparing',
                        'bg-green-100 text-green-800': order.status === 'delivered',
                        'bg-gray-100 text-gray-800': order.status === 'cancelled'
                      }"
                      x-text="statusLabel(order.status)">
                    </span>
                  </td>
                  <td class="p-3">
                    <select @change="updateStatus(order.id, $event.target.value)" class="admin-input text-xs py-1">
                      <option value="" disabled selected>Изменить</option>
                      <option value="new">Новый</option>
                      <option value="confirmed">Подтверждён</option>
                      <option value="preparing">Готовится</option>
                      <option value="delivered">Доставлен</option>
                      <option value="cancelled">Отменён</option>
                    </select>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="admin-card p-4 flex flex-wrap items-center justify-between gap-3">
          <div class="text-sm" style="color:var(--text-muted)">
            Показано <span x-text="orders.length"></span> из <span x-text="total"></span>
          </div>
          <div class="flex items-center gap-2">
            <button @click="prevPage()" :disabled="page === 1" class="btn-secondary" :class="{ 'opacity-50 cursor-not-allowed': page === 1 }">Назад</button>
            <span class="text-sm" style="color:var(--text-primary)">Стр. <span x-text="page"></span> из <span x-text="totalPages()"></span></span>
            <button @click="nextPage()" :disabled="page >= totalPages()" class="btn-secondary" :class="{ 'opacity-50 cursor-not-allowed': page >= totalPages() }">Вперёд</button>
          </div>
          <div>
            <select x-model="limit" @change="page=1; load()" class="admin-input text-xs py-1">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>
      </div>
    </template>
  </div>

  <script>
    function adminApp() {
      return {
        token: localStorage.getItem("adminToken") || "",
        inputUsername: "",
        inputPassword: "",
        error: "",
        orders: [],
        companies: [],
        customers: [],
        newCustomer: { company_name: "", address: "", customer_phone: "" },
        editingId: null,
        editCustomer: { company_name: "", address: "", customer_phone: "" },
        stats: { total: 0, new: 0, confirmed: 0, preparing: 0, delivered: 0 },
        filter: { status: "", company: "", date: "", dateFrom: new Date().toISOString().split("T")[0], search: "" },
        page: 1,
        limit: 25,
        total: 0,
        sortDesc: false,

        init() {
          if (this.token) {
            this.loadCustomers();
            this.loadCompanies();
            this.load();
          }
        },

        totalPages() {
          return Math.max(1, Math.ceil(this.total / this.limit));
        },

        prevPage() {
          if (this.page > 1) {
            this.page--;
            this.load();
          }
        },

        nextPage() {
          if (this.page < this.totalPages()) {
            this.page++;
            this.load();
          }
        },

        resetFilters() {
          this.filter = { status: "", company: "", date: "", dateFrom: "", search: "" };
          this.page = 1;
          this.load();
        },

        async login() {
          this.error = "";
          try {
            const res = await fetch("/api/admin/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: this.inputUsername, password: this.inputPassword })
            });
            const data = await res.json();
            if (!res.ok || !data.token) {
              this.error = data.error || "Неверный логин или пароль";
              return;
            }
            this.token = data.token;
            localStorage.setItem("adminToken", this.token);
            await this.loadCustomers();
            await this.loadCompanies();
            await this.load();
          } catch (err) {
            this.error = "Ошибка соединения";
          }
        },

        logout() {
          this.token = "";
          this.orders = [];
          this.customers = [];
          localStorage.removeItem("adminToken");
        },

        headers() {
          return { "X-Admin-Token": this.token, "Content-Type": "application/json" };
        },

        async loadCustomers() {
          try {
            const res = await fetch("/api/admin/customers", { headers: this.headers() });
            if (!res.ok) throw new Error("Unauthorized");
            this.customers = (await res.json()).customers;
          } catch (err) {
            console.error(err);
          }
        },

        async addCustomer() {
          if (!this.newCustomer.company_name.trim()) return;
          try {
            const res = await fetch("/api/admin/customers", {
              method: "POST",
              headers: this.headers(),
              body: JSON.stringify(this.newCustomer)
            });
            if (!res.ok) {
              const data = await res.json();
              alert(data.error || "Ошибка");
              return;
            }
            this.newCustomer = { company_name: "", address: "", customer_phone: "" };
            await this.loadCustomers();
            await this.loadCompanies();
          } catch (err) {
            console.error(err);
          }
        },

        startEdit(customer) {
          this.editingId = customer.id;
          this.editCustomer = { ...customer };
        },

        cancelEdit() {
          this.editingId = null;
          this.editCustomer = { company_name: "", address: "", customer_phone: "" };
        },

        async saveEdit(id) {
          try {
            const res = await fetch(`/api/admin/customers/${id}`, {
              method: "PATCH",
              headers: this.headers(),
              body: JSON.stringify(this.editCustomer)
            });
            if (!res.ok) {
              const data = await res.json();
              alert(data.error || "Ошибка");
              return;
            }
            this.editingId = null;
            await this.loadCustomers();
            await this.loadCompanies();
            await this.load();
          } catch (err) {
            console.error(err);
          }
        },

        async deleteCustomer(id) {
          if (!confirm("Удалить заказчика?")) return;
          try {
            const res = await fetch(`/api/admin/customers/${id}`, {
              method: "DELETE",
              headers: this.headers()
            });
            if (!res.ok) return;
            await this.loadCustomers();
            await this.loadCompanies();
            await this.load();
          } catch (err) {
            console.error(err);
          }
        },

        buildQuery() {
          const params = new URLSearchParams();
          if (this.filter.status) params.append("status", this.filter.status);
          if (this.filter.company) params.append("company", this.filter.company);
          if (this.filter.date) params.append("date", this.filter.date);
          if (this.filter.dateFrom) params.append("date_from", this.filter.dateFrom);
          if (this.filter.search) params.append("search", this.filter.search);
          params.append("sort", "delivery_date");
          params.append("order", this.sortDesc ? "desc" : "asc");
          params.append("limit", this.limit);
          params.append("offset", (this.page - 1) * this.limit);
          return params.toString();
        },

        async load() {
          try {
            const [ordersRes, statsRes] = await Promise.all([
              fetch(`/api/admin/orders?${this.buildQuery()}`, { headers: this.headers() }),
              fetch("/api/admin/stats", { headers: this.headers() })
            ]);

            if (!ordersRes.ok) throw new Error("Unauthorized");

            const ordersData = await ordersRes.json();
            this.orders = ordersData.orders;
            this.total = ordersData.total || 0;
            this.stats = await statsRes.json();
            this.error = "";
          } catch (err) {
            this.token = "";
            this.error = "Неверный токен";
            localStorage.removeItem("adminToken");
          }
        },

        async loadCompanies() {
          try {
            const res = await fetch("/api/admin/companies", { headers: this.headers() });
            if (res.ok) {
              this.companies = (await res.json()).companies;
            }
          } catch (err) {
            console.error(err);
          }
        },

        async updateStatus(id, status) {
          if (!status) return;
          try {
            const res = await fetch(`/api/admin/orders/${id}/status`, {
              method: "PATCH",
              headers: this.headers(),
              body: JSON.stringify({ status })
            });
            if (res.ok) await this.load();
          } catch (err) {
            console.error(err);
          }
        },

        statusLabel(status) {
          const labels = {
            new: "Новый",
            confirmed: "Подтверждён",
            preparing: "Готовится",
            delivered: "Доставлен",
            cancelled: "Отменён"
          };
          return labels[status] || status;
        }
      };
    }
  </script>
</body>
</html>
