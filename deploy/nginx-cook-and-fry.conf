# HTTP-only reverse proxy for Cook and Fry
# Replace 82.26.94.231 with your domain when you get one.

server {
    listen 80;
    server_name 82.26.94.231;

    root /home/pasha/cook-and-fry/frontend;
    index index.html;

    access_log /var/log/nginx/cook-and-fry.access.log;
    error_log  /var/log/nginx/cook-and-fry.error.log;

    # Compress text assets for faster loading
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets (CSS, JS, images, fonts) on the client side
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API and dynamic requests go to the Node.js app
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_cache_bypass $http_upgrade;
    }

    # Static pages are served by nginx; fall back to the app if not found
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_cache_bypass $http_upgrade;
    }
}
