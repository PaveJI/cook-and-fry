# HTTPS reverse proxy for Cook and Fry (naobedvbufet.ru)
# 1. DNS A-record for naobedvbufet.ru -> 82.26.94.231
# 2. Obtain certificates: sudo certbot --nginx -d naobedvbufet.ru -d www.naobedvbufet.ru
# 3. Enable this site and reload nginx.

server {
    listen 80;
    server_name naobedvbufet.ru www.naobedvbufet.ru;
    return 301 https://naobedvbufet.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name naobedvbufet.ru www.naobedvbufet.ru;

    root /home/pasha/cook-and-fry/frontend;
    index index.html;

    access_log /var/log/nginx/cook-and-fry.access.log;
    error_log  /var/log/nginx/cook-and-fry.error.log;

    ssl_certificate     /etc/letsencrypt/live/naobedvbufet.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naobedvbufet.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_cache_bypass $http_upgrade;
    }

    location / {
        # Landing page is the SEO entry point; fall back to order form and then backend
        try_files /landing.html /index.html @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_cache_bypass $http_upgrade;
    }
}
